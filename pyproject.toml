[project]
name = "regs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rahaf Elayyan", email = "rahaf.elayyann@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
]

[project.scripts]
regs = "regs:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
